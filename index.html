  const isOpen = panel.style.display !== 'none';
  // Close all panels first
  document.querySelectorAll('.ms-panel').forEach(p => p.style.display='none');
  if(!isOpen) panel.style.display = 'block';
}
document.addEventListener('click', function(e){
  if(!e.target.closest('.filter-group-ms')){
    document.querySelectorAll('.ms-panel').forEach(p => p.style.display='none');
  }
});

// ─── Week dropdown ────────────────────────────────────────────────────────────
// Computes real Mon–Fri date ranges for a given "YYYY-MM" month string
function weeksForMonth(yrMon){
  const [yr, mo] = yrMon.split('-').map(Number);
  const lastDay = new Date(yr, mo, 0).getDate();
  const firstDow = new Date(yr, mo - 1, 1).getDay(); // 0=Sun,1=Mon,...,6=Sat
  const daysToMon = firstDow === 1 ? 0 : firstDow === 0 ? 1 : (8 - firstDow);
  const firstMon = 1 + daysToMon;
  const MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const mn = MN[mo - 1];
  const weeks = [];
  // Partial first week: if month starts on Tue–Fri, add W1 from day 1 to first Friday
  if(firstDow >= 2 && firstDow <= 5){
    const partialEnd = Math.min(firstMon - 1, 1 + (5 - firstDow));
    weeks.push({ key:'W1', label:`W1: ${mn} 1–${partialEnd}`, startDay:1, endDay:partialEnd });
  }
  // Regular Mon–Fri weeks; last Monday's week always extends to end of month
  const mondays = [];
  for(let m = firstMon; m <= lastDay; m += 7) mondays.push(m);
  mondays.forEach((monDay, idx) => {
    const isLastMon = idx === mondays.length - 1;
    // If last Monday leaves a stub < 5 days and a previous week exists, merge into it
    if(isLastMon && monDay + 4 > lastDay && weeks.length > 0){
      weeks[weeks.length - 1].endDay = lastDay;
      const prev = weeks[weeks.length - 1];
      prev.label = `W${weeks.length}: ${mn} ${prev.startDay}–${lastDay}`;
    } else {
      const wNum = weeks.length + 1;
      const endDay = isLastMon ? lastDay : Math.min(monDay + 4, lastDay);
      weeks.push({ key:`W${wNum}`, label:`W${wNum}: ${mn} ${monDay}–${endDay}`, startDay:monDay, endDay });
    }
  });
  return weeks;
}

function rebuildWeekDropdown(){
  const wSel = document.getElementById('filterWeek');
  wSel.innerHTML = '';
  if(S.year === '2025'){
    const opt = document.createElement('option');
    opt.value = 'all';
    opt.textContent = 'N/A — no data for 2025';
    wSel.appendChild(opt);
    wSel.disabled = true;
    S.week = 'all';
    return;
  }
  if(S.months.length !== 1){
    const opt = document.createElement('option');
    opt.value = 'all';
    opt.textContent = S.months.length === 0 ? 'Select one month' : 'Select one month for weekly view';
    wSel.appendChild(opt);
    wSel.disabled = true;
    S.week = 'all';
    return;
  }
  wSel.disabled = false;
  const mon = S.months[0];
  const allOpt = document.createElement('option');
  allOpt.value = 'all';
  allOpt.textContent = 'All Weeks';
  wSel.appendChild(allOpt);
  const wks = weeksForMonth(mon);
  wks.forEach(wk => {
    const snapKey = mon + '-' + wk.key;
    const hasSnap = !!RAW_DATA.weeklySnapshots[snapKey];
    const opt = document.createElement('option');
    opt.value = snapKey;
    opt.textContent = wk.label + (hasSnap ? ' (actual)' : ' (est.)');
    wSel.appendChild(opt);
  });
  wSel.value = 'all';
  S.week = 'all';
}

// ─── Period matching helpers ──────────────────────────────────────────────────
function matchesPoc(poc){
  if(S.pocs.length === 0) return true;
  return S.pocs.includes(poc);
}

function matchesPeriod(activeFrom){
  if(!activeFrom) return false;
  if(S.year === 'all') return true;
  if(S.months.length === 0) return activeFrom.startsWith(S.year);
  return S.months.includes(activeFrom);
}

// Project in ASANA_DATES overlaps with selected period
function projectInPeriod(gid){
  if(S.year === 'all') return true;
  const d = ASANA_DATES[gid];
  if(!d) return true; // no date = always show
  const start = d.startMon || '2020-01';
  const end = d.endMon || '2099-12';
  if(S.months.length === 0){
    // year-level: any month in year overlaps
    const yrStart = S.year + '-01';
    const yrEnd = S.year + '-12';
    return monCmp(start, yrEnd) <= 0 && monCmp(end, yrStart) >= 0;
  }
  return S.months.some(m => monCmp(start, m) <= 0 && monCmp(end, m) >= 0);
}


// ─── Format YYYY-MM → "Jun-2025" for display ─────────────────────────────────
function formatMonthLabel(mon){
  if(!mon) return '—';
  const mm=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const m=parseInt((mon||'').slice(5,7),10)-1;
  const y=(mon||'').slice(0,4);
  return (mm[m]||mon)+'-'+y;
}
// ─── Delivery month logic ─────────────────────────────────────────────────────
// Rules:
// • Primary source: spreadsheet "Automation effective from which month" → activeFrom field
// • Fallback: any automation tracked in the Asana portfolio (ASANA_DATES) uses its endMon
//   provided that endMon is within the current tracking window (≤ 2026-06).
// Source: spreadsheet "Automation effective from which month" → activeFrom field
// All delivered automations have activeFrom set from the spreadsheet directly.
function getDeliveryMonth(a){
  if(a.activeFrom) return a.activeFrom;
  return null; // not delivered yet
}

// ─── Filter automations (expanded sourcing) ───────────────────────────────────
function filterAutos(){
  // Single source of truth: AUTOMATIONS_RAW (spreadsheet col A/B/F/J/R)
  return AUTOMATIONS_RAW.filter(a=>{
    if(!matchesPoc(a.poc)) return false;
    if(S.year==='all') return true; // all time: show all POC rows
    const dm=a.activeFrom||null;
    if(!dm) return false;
    if(S.months.length===0) return dm.startsWith(S.year);
    return S.months.includes(dm);
  });
}

function getAutoSource(a){
  const br=(a.buildReadiness||'').toLowerCase();
  const hasAsanaLive=a.asanaUrl&&(br==='live');
  if(a.activeFrom){
    // Has spreadsheet data
    if(a.activeFrom>='2026-03'&&hasAsanaLive) return 'both'; // Both: spreadsheet + Asana confirms Live for Mar 2026+
    return 'spreadsheet'; // All other cases with activeFrom = Spreadsheet
  }
  // No activeFrom
  if(hasAsanaLive) return 'asana'; // No spreadsheet, Asana confirms Live
  if(a.asanaUrl) return 'asana';
  return 'spreadsheet';
}

// ─── Quarter from activeFrom (YYYY-MM) ────────────────────────────────────────
function getQuarter(activeFrom){
  if(!activeFrom) return '—';
  const mon=parseInt(activeFrom.slice(5,7),10);
  const yr=activeFrom.slice(0,4);
  const q=mon<=3?'Q1':mon<=6?'Q2':mon<=9?'Q3':'Q4';
  return q+' '+yr;
}

// ─── Status dot ───────────────────────────────────────────────────────────────
function statusDot(status){
  const s = (status||'').toLowerCase();
  let cls = 'dot-grey';
  if(['live','delivered','active'].includes(s)) cls = 'dot-green';
  else if(['logic ready','in qa','in progress','in development','logic ready in make'].includes(s)) cls = 'dot-amber';
  return `<span class="status-cell"><span class="status-dot ${cls}"></span>${escHtml(status)}</span>`;
}

function buildBadge(br){
  if(!br) return '';
  const b = (br||'').toLowerCase();
  let cls = 'badge-planned';
  if(b==='live') cls='badge-live';
  else if(b.includes('logic ready')) cls='badge-logic';
  else if(b.includes('development')||b.includes('qa level')) cls='badge-dev';
  else if(b.includes('on hold')) cls='badge-hold';
  else if(b.includes('pending')) cls='badge-pending';
  return `<span class="badge ${cls}">${escHtml(br)}</span>`;
}

// ─── Automations Delivered: count from Automations spreadsheet (col B × col J × col R) ─
// Year=All → count ALL rows (total projects in spreadsheet), filtered by POC
// Specific year/month → count rows with matching activeFrom
function computeDelivered(){
  // When a specific week is selected → count items delivered that week from ASANA_DELIVERED_ITEMS
  if(S.week && S.week!=='all') return getDeliveredForWeek(S.week).length;
  return filterAutos().length;
}

// ─── Hours Saved: computed from Automations spreadsheet (col F × col J × col R) ─
function computeHoursSaved(){
  // When a specific week is selected → sum hours of items delivered that week
  if(S.week && S.week!=='all'){
    return getDeliveredForWeek(S.week).reduce((s,a)=>s+(a.hours||0),0);
  }
  return filterAutos().reduce((s,a)=>s+(a.hoursSaved||0),0);
}

// ─── KPI computations ─────────────────────────────────────────────────────────
function computeKPIs(){
  const delivered = computeDelivered(); // count from Automations spreadsheet (col B, J, R)

  // ── Hours Saved: derived from Automations tab (col F, J, R) ──
  const hours = computeHoursSaved();

  let quality = 'N/A';
  const singleMon = S.months.length === 1 ? S.months[0] : null;
  if(singleMon && RAW_DATA.quality[singleMon]){
    const q = RAW_DATA.quality[singleMon];
    if(S.pocs.length === 1 && q.by_poc && q.by_poc[S.pocs[0]] !== undefined){
      quality = q.by_poc[S.pocs[0]].toFixed(2)+'%';
    } else if(S.pocs.length === 0){
      quality = q.overall.toFixed(2)+'%';
    }
  } else if(S.months.length > 1){
    const qualMons = S.months.filter(m => RAW_DATA.quality[m]);
    if(qualMons.length > 0){
      let sum=0,cnt=0;
      qualMons.forEach(m => { const q=RAW_DATA.quality[m]; if(S.pocs.length===1&&q.by_poc&&q.by_poc[S.pocs[0]]!==undefined){sum+=q.by_poc[S.pocs[0]];cnt++;}else if(S.pocs.length===0){sum+=q.overall;cnt++;} });
      if(cnt>0) quality=(sum/cnt).toFixed(2)+'%';
    }
  } else if(S.months.length === 0 && S.year !== 'all'){
    const qualMons = Object.keys(RAW_DATA.quality).filter(k=>k.startsWith(S.year));
    if(qualMons.length>0){let sum=0,cnt=0;qualMons.forEach(k=>{const q=RAW_DATA.quality[k];if(S.pocs.length===1&&q.by_poc&&q.by_poc[S.pocs[0]]!==undefined){sum+=q.by_poc[S.pocs[0]];cnt++;}else if(S.pocs.length===0){sum+=q.overall;cnt++;}});if(cnt>0)quality=(sum/cnt).toFixed(2)+'%';}
  } else if(S.year === 'all'){
    const qualMons = Object.keys(RAW_DATA.quality);
    if(qualMons.length>0){let sum=0,cnt=0;qualMons.forEach(k=>{sum+=RAW_DATA.quality[k].overall;cnt++;});quality=(sum/cnt).toFixed(2)+'%';}
  }

  // ── Credits Used: use spreadsheet per-POC data when a POC filter is active ──
  let credits = 'N/A';
  if(S.pocs.length > 0){
    // POC(s) selected — sum from CREDITS_BY_POC_MONTH; N/A if none have data
    let creditTotal = 0, hasAnyData = false;
    const creditMonths = S.months.length > 0 ? S.months
      : S.year && S.year !== 'all' ? Object.keys(RAW_DATA.credits.monthly).filter(m => m.startsWith(S.year))
      : Object.keys(RAW_DATA.credits.monthly);
    S.pocs.forEach(poc => {
      const pocData = CREDITS_BY_POC_MONTH[poc];
      if(pocData){ creditMonths.forEach(m => { if(pocData[m]!==undefined){ creditTotal += pocData[m]; hasAnyData=true; } }); }
    });
    credits = hasAnyData ? fmtNum(creditTotal) : 'N/A';
  } else if(S.months.length === 1){
    const m = S.months[0];
    if(RAW_DATA.credits.monthly[m]!==undefined) credits = fmtNum(RAW_DATA.credits.monthly[m]);
  } else if(S.months.length > 1){
    const total = S.months.reduce((s,m)=>s+(RAW_DATA.credits.monthly[m]||0),0);
    credits = fmtNum(total);
  } else if(S.year==='2026' || S.year==='all'){
    const total = Object.values(RAW_DATA.credits.monthly).reduce((s,v)=>s+v,0);
    credits = fmtNum(total);
  }

  return { delivered, hours: fmtNum(hours,1), quality, credits };
}

// ─── Approximate week data ────────────────────────────────────────────────────
function getApproxWeekData(yrMon, weekNum){
  const hours = (RAW_DATA.hoursbyMonth[yrMon]||0) / 4;
  const credits = RAW_DATA.credits.monthly[yrMon] ? Math.round(RAW_DATA.credits.monthly[yrMon]/4) : null;
  const quality = RAW_DATA.quality[yrMon] ? RAW_DATA.quality[yrMon].overall : null;
  const autos = RAW_DATA.automations.filter(a=>a.activeFrom===yrMon).length;
  return {hours:Math.round(hours*10)/10, credits, quality, automations:autos, isApprox:true};
}

function getWeekData(weekKey){
  const snap = RAW_DATA.weeklySnapshots[weekKey];
  if(snap) return {snap, isApprox:false};
  // Approximate
  const m = weekKey.slice(0,7);
  const wNum = parseInt(weekKey.slice(9))||1;
  const data = getApproxWeekData(m, wNum);
  return {snap:null, isApprox:true, approx:data};
}

// ─── Charts ───────────────────────────────────────────────────────────────────
function renderCharts(){
  if(creditsChart){creditsChart.destroy();creditsChart=null;}
  if(qualityChart){qualityChart.destroy();qualityChart=null;}
  const creditMonths=['2026-01','2026-02','2026-03','2026-04','2026-05','2026-06','2026-07'];
  const creditLabels=['Jan','Feb','Mar','Apr','May','Jun','Jul'];
  // Use per-POC data from CREDITS_BY_POC_MONTH when a POC filter is active
  // Returns null (→ N/A) when none of the selected POCs have credit data for a month
  const creditVals=creditMonths.map(m=>{
    if(S.pocs.length>0){
      let total=0, hasData=false;
      S.pocs.forEach(poc=>{
        const pocData=CREDITS_BY_POC_MONTH[poc];
        if(pocData && pocData[m]!==undefined){ total+=pocData[m]; hasData=true; }
      });
      return hasData ? total : null;
    }
    return RAW_DATA.credits.monthly[m]||0;
  });
  const creditColors=creditMonths.map(m=>(S.months.includes(m))?'#1F6FEB':'rgba(31,111,235,0.4)');
  const creditBorders=creditMonths.map(m=>(S.months.includes(m))?'#79c0ff':'#1F6FEB');
  const cCtx=document.getElementById('creditsCanvas');
  // Dynamic chart title: show POC name(s) when filtered
  const creditTitle = S.pocs.length===0 ? 'Monthly Credits Used — Jan–Jul 2026'
    : 'Credits Used: '+(S.pocs.length===1 ? S.pocs[0] : S.pocs.length+' Members')+' — Jan–Jul 2026';
  const creditCardTitle = document.querySelector('.chart-card h3');
  if(creditCardTitle) creditCardTitle.textContent = creditTitle;
  if(cCtx){creditsChart=new Chart(cCtx.getContext('2d'),{type:'bar',data:{labels:creditLabels,datasets:[{label:'Credits Used',data:creditVals,backgroundColor:creditColors,borderColor:creditBorders,borderWidth:1,borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>ctx.parsed.y===null?' N/A':' '+fmtNum(ctx.parsed.y)}}},scales:{x:{ticks:{color:'#8B949E'},grid:{color:'rgba(33,38,45,0.8)'}},y:{ticks:{color:'#8B949E',callback:v=>v===null?'N/A':fmtNum(v)},grid:{color:'rgba(33,38,45,0.8)'},beginAtZero:true}}}});}
  const qualYear=S.year!=='all'?S.year:'2026';
  const qualMons=Object.keys(RAW_DATA.quality).filter(k=>k.startsWith(qualYear)).sort();
  const qualLabels=qualMons.map(m=>new Date(m+'-01').toLocaleString('en-US',{month:'short'}));
  // Dynamic: use per-POC quality when filtered, overall when All Members
  const qualVals=qualMons.map(m=>{
    const qMonth=RAW_DATA.quality[m];
    if(!qMonth) return null;
    if(S.pocs.length===0) return qMonth.overall;
    // One or more POCs selected — average the ones that have data
    let sum=0, cnt=0;
    S.pocs.forEach(poc=>{
      if(qMonth.by_poc && qMonth.by_poc[poc]!==undefined){ sum+=qMonth.by_poc[poc]; cnt++; }
    });
    return cnt>0 ? sum/cnt : null; // null = N/A (no quality data for this POC)
  });
  // Dynamic quality chart title
  const qualTitle = S.pocs.length===0 ? 'Quality Score % — Jan–Jul 2026'
    : 'Quality Score: '+(S.pocs.length===1 ? S.pocs[0] : S.pocs.length+' Members')+' — Jan–Jul 2026';
  const qualCardTitles = document.querySelectorAll('.chart-card h3');
  if(qualCardTitles[1]) qualCardTitles[1].textContent = qualTitle;
  const qCtx=document.getElementById('qualityCanvas');
  if(qCtx){
    // Scrollable quality chart: each month gets 110px; wraps with overflow-x:auto
    // canvas.style.width drives visual size; canvas.width = same value sets draw buffer
    const PX_PER_MON = 110;
    const wrapEl = document.getElementById('qualityChartWrap');
    const wrapNatW = wrapEl ? wrapEl.clientWidth : 600;
    const needW = qualMons.length * PX_PER_MON;
    const canvasW = Math.max(needW, wrapNatW);
    // Apply scroll only if content wider than wrapper
    if(wrapEl){
      wrapEl.style.overflowX = needW > wrapNatW ? 'auto' : 'hidden';
      wrapEl.style.overflowY = 'hidden';
    }
    // Set canvas draw-buffer size (Chart.js reads these with responsive:false)
    qCtx.width  = canvasW;
    qCtx.height = 220;
    // Constrain canvas CSS so it never overflows the page — scroll happens inside wrapEl
    qCtx.style.maxWidth = 'none';
    qCtx.style.display  = 'block';

// ─── Automations table ────────────────────────────────────────────────────────
function renderAutomationsTable(){
  let rows = filterAutos();
  if(deptFilter!=='all') rows=rows.filter(a=>a.team===deptFilter);

  // Sort by activeFrom descending (most recent first), then alphabetically
  rows.sort((a,b)=>{
    const da=a.activeFrom||'';
    const db=b.activeFrom||'';
    if(db!==da) return db.localeCompare(da);
    return (a.scenario||'').localeCompare(b.scenario||'');
  });

  const allRows = filterAutos();
  const depts=['all',...new Set(allRows.map(a=>a.team).filter(Boolean).sort())];
  const deptOpts=depts.map(d=>`<option value="${escHtml(d)}" ${deptFilter===d?'selected':''}>${d==='all'?'All Departments':escHtml(d)}</option>`).join('');

  // Build Asana portfolio name → URL lookup (from roadmap + RAW_DATA scenarios)
  const portfolioLookup={};
  [...(RAW_DATA.roadmap.live||[]),...(RAW_DATA.roadmap.active||[]),...(RAW_DATA.roadmap.planned||[])].forEach(p=>{
    if(p.name&&p.url) portfolioLookup[p.name.toLowerCase().trim()]=p.url;
  });
  // Also index RAW_DATA.automations by scenario name for asanaUrl fallback
  const scenarioUrlMap={};
  RAW_DATA.automations.forEach(a=>{
    if(a.scenario&&a.asanaUrl) scenarioUrlMap[a.scenario.toLowerCase().trim()]=a.asanaUrl;
  });
  function getAutoLink(a){
    const key=(a.scenario||'').toLowerCase().trim();
    if(portfolioLookup[key]) return portfolioLookup[key];
    if(scenarioUrlMap[key]) return scenarioUrlMap[key];
    return null;
  }

  let tableBody='';
  if(rows.length===0){
    tableBody=`<tr><td colspan="6" class="no-data">No automations match the current filters.</td></tr>`;
  } else {
    rows.forEach((a,i)=>{
      const link=getAutoLink(a);
      const nameCell=link
        ?`<a href="${escHtml(link)}" target="_blank" rel="noopener" style="color:#E6EDF3;text-decoration:none" onmouseover="this.style.color='#58a6ff'" onmouseout="this.style.color='#E6EDF3'">${escHtml(a.scenario)}</a>`
        :escHtml(a.scenario);
      tableBody+=`<tr>
        <td style="color:#8B949E;width:36px">${i+1}</td>
        <td>${nameCell}</td>
        <td style="color:#8B949E">${escHtml(a.team)}</td>
        <td style="color:#8B949E">${escHtml(a.poc)}</td>
        <td style="color:#8B949E;white-space:nowrap">${formatMonthLabel(a.activeFrom)}</td>
        <td style="color:#8B949E">${getQuarter(a.activeFrom)}</td>
      </tr>`;
    });
  }
  return `<div class="table-section">
    <div class="table-header">
      <h3>Automations Delivered — ${rows.length} automation${rows.length===1?'':'s'}</h3>
      <select onchange="deptFilter=this.value;render()">${deptOpts}</select>
    </div>
    <div class="table-scroll">
      <table>
        <thead><tr><th>#</th><th>Automation Name</th><th>Department</th><th>Point of Contact</th><th>Active From</th><th>Quarter</th></tr></thead>
        <tbody>${tableBody}</tbody>
      </table>
    </div>
  </div>`;
}

// ─── In Development (date-filtered) ──────────────────────────────────────────
function devPocMatch(responsible){
  if(S.pocs.length===0) return true;
  return S.pocs.some(poc=>(POC_ASANA_MAP[poc]||[poc]).includes(responsible));
}

function getDevStatus(initialDueRespected, projectStatus){
  if(projectStatus==='green') return {label:'On Track',cls:'badge-ontrack'};
  if(projectStatus==='yellow') return {label:'At Risk',cls:'badge-atrisk'};
  if(projectStatus==='red') return {label:'Off Track',cls:'badge-offtrack'};
  if(projectStatus==='blue') return {label:'On Hold',cls:'badge-hold'};
  if(initialDueRespected==='Yes') return {label:'On Track',cls:'badge-ontrack'};
  if(initialDueRespected==='No') return {label:'Off Track',cls:'badge-offtrack'};
  if(initialDueRespected==='See Milestone Notes') return {label:'At Risk',cls:'badge-atrisk'};
  return null;
}

function getDevItems(){
  // 2025: track from Spreadsheet — automations not yet delivered during the selected period
  if(S.year==='2025'){
    const selMons=S.months.length>0 ? S.months : null;
    return RAW_DATA.automations.filter(a=>{
      if(!matchesPoc(a.poc)) return false;
      const dm=getDeliveryMonth(a);
      if(selMons){
        const latestSel=selMons.slice().sort().pop();
        return !dm || dm>latestSel;
      } else {
        return !dm || dm>='2026-01';
      }
    }).map(a=>({
      name:a.scenario, gid:'', url:a.asanaUrl||'',
      team:a.team, responsible:a.poc,
      buildReadiness:a.buildReadiness||'In Development',
      initialDueRespected:'', initialDue:''
    }));
  }
  // 2026+ / All: use ASANA_INDEV_ITEMS with Build Readiness + dueEnd month filter
  // (same source as weekly view — dueEnd = end date of Asana Due Date range)
  return ASANA_INDEV_ITEMS.filter(item=>{
    if(!devPocMatch(item.responsible)) return false;
    if(!IN_DEV_STATUSES.has(item.buildReadiness)) return false;
    if(S.year==='all') return true;
    if(S.months.length>0){
      // Specific month(s): show if dueEnd starts with selected month OR no dueEnd set
      return S.months.some(m => !item.dueEnd || item.dueEnd.startsWith(m));
    }
    // Year-level: show if dueEnd is in the selected year OR no dueEnd set
    return !item.dueEnd || item.dueEnd.startsWith(S.year);
  }).map(item=>({
    ...item,
    initialDue: item.dueEnd || item.initialDue // use dueEnd for Quarter display
  }));
}

// ─── Pipeline (date-filtered) ─────────────────────────────────────────────────
// Source: ASANA_PIPELINE_ITEMS (Responsible = "In Pipeline" in Asana Portfolio).
// These items are not assigned to a specific POC — show for ANY member selection.
// Period filter: uses the Asana "Quarter" field directly (e.g. "Q2 2026", "Q3 2026").
function quarterToMonths(q){
  // "Q2 2026" → ["2026-04","2026-05","2026-06"]
  if(!q) return [];
  const yr=q.slice(-4);
  const qn=parseInt(q[1]);
  const base=(qn-1)*3+1;
  return [base,base+1,base+2].map(m=>yr+'-'+(m<10?'0'+m:''+m));
}
function pipelineMatchesPeriod(item){
  // Pipeline is a planning view — show all items for the selected year regardless of month
  if(S.year==='all') return true;
  const itemYear=(item.quarter||'').slice(-4) || (item.due_on||'').slice(0,4);
  if(!itemYear) return true; // no year/quarter set → always show
  return itemYear===S.year;
}
function getPipelineItems(){
  if(S.year==='2025') return [];
  // Pipeline shows all Not Yet Started items for the year — no POC filter (all responsible shown)
  return ASANA_PIPELINE_ITEMS.filter(pipelineMatchesPeriod);
}

// ─── Dependencies section ─────────────────────────────────────────────────────
function depPeriodMatch(initialDue){
  if(S.year==='all') return true;
  if(!initialDue) return true;
  if(S.months.length>0) return S.months.includes(initialDue);
  return initialDue.startsWith(S.year);
}

function dueEndMatchesPeriod(dueEnd){
  // Same dueEnd logic as getDevItems/getDepsForWeek — for monthly/annual views
  if(S.year==='all') return true;
  if(S.months.length>0) return !dueEnd || S.months.some(m => dueEnd.startsWith(m));
  return !dueEnd || dueEnd.startsWith(S.year);
}

function pendingSinceMatchesPeriod(pendingSince){
  // Filter Dependencies & Blockers by the date the item was moved to Pending status
  if(S.year==='all') return true;
  if(!pendingSince) return true; // no date → always show
  if(S.months.length>0) return S.months.some(m => pendingSince.startsWith(m));
  return pendingSince.startsWith(S.year);
}

function getDepsForPeriod(){
  // Dependencies & Blockers: ONLY Pending Information from Stakeholders items
  // Period filter uses pendingSince (date the item was moved to this status in Asana)
  const deps = [];
  // Show all currently pending items — a blocker is visible regardless of when it started
  const pendingInfo = ASANA_INDEV_ITEMS.filter(item =>
    item.buildReadiness === 'Pending Information from Stakeholders' &&
    devPocMatch(item.responsible)
  );
  const onHold = [];
  return {deps, pendingInfo, onHold};
}

// ─── Dependencies for a specific week (uses ASANA_INDEV_ITEMS + dueEnd filter) ─
function getDepsForWeek(weekKey){
  // Dependencies & Blockers: ALL currently Pending Information from Stakeholders items
  // No date filter — a blocker remains visible until resolved, regardless of when it started
  const deps = [];
  const pendingInfo = ASANA_INDEV_ITEMS.filter(item =>
    item.buildReadiness === 'Pending Information from Stakeholders' &&
    devPocMatch(item.responsible)
  );
  const onHold = [];
  return {deps, pendingInfo, onHold};
}

function depStatusCls(st){
  const s=(st||'').toLowerCase().replace(/\s/g,'');
  if(s==='blocked') return 'dep-blocked';
  if(s==='onhold') return 'dep-onhold';
  if(s==='waiting') return 'dep-waiting';
  if(s==='inprogress') return 'dep-inprogress';
  return 'dep-pending';
}

function renderDependencies(weekKey){
  const {deps, pendingInfo, onHold} = weekKey ? getDepsForWeek(weekKey) : getDepsForPeriod();
  const total = deps.length + pendingInfo.length + onHold.length;
  if(total===0) return '';

  // ── Dependency cards ──
  const depCards = deps.map(dep=>{
    const typeCls='dep-'+dep.type;
    const projUrl=`https://app.asana.com/1/1171561328161113/project/${dep.gid}`;
    const blockerUrl=dep.depGid?`https://app.asana.com/1/1171561328161113/project/${dep.depGid}`:null;
    const projLink=`<a href="${projUrl}" target="_blank" rel="noopener" style="color:#E6EDF3">${escHtml(dep.project)}</a>`;
    const blockerLink=blockerUrl?`<a href="${blockerUrl}" target="_blank" rel="noopener">${escHtml(dep.dependsOn)}</a>`:escHtml(dep.dependsOn);
    return `<div class="dep-card">
      <div>
        <div class="dep-project">${projLink}</div>
        <div class="dep-arrow">depends on → ${blockerLink}</div>
        <div class="dep-reason">${escHtml(dep.reason)}</div>
        <div class="dep-meta">${escHtml(dep.responsible||'')} · ${getQuarter(dep.initialDue)}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end;white-space:nowrap">
        <span class="dep-type-badge dep-${dep.type}">${escHtml(dep.type)}</span>
        <span class="dep-status-badge ${depStatusCls(dep.status)}">${escHtml(dep.status)}</span>
      </div>
    </div>`;
  }).join('');

  // ── Pending Info cards ──
  const pendingCards = pendingInfo.map(item=>{
    const projLink=`<a href="${escHtml(item.url)}" target="_blank" rel="noopener" style="color:#E6EDF3">${escHtml(item.name)}</a>`;
    // Calculate days pending
    const daysPending = item.pendingSince
      ? Math.floor((new Date() - new Date(item.pendingSince+'T00:00:00')) / (1000*60*60*24))
      : null;
    const daysLabel = daysPending !== null
      ? (daysPending === 0 ? 'Today' : daysPending === 1 ? '1 day' : daysPending < 7 ? daysPending+' days' : Math.floor(daysPending/7)+'w '+( daysPending%7>0 ? (daysPending%7)+'d' : ''))
      : '';
    const pendingFrom = item.pendingActionFrom || 'Stakeholder';
    const milestoneText = item.milestone || '';
    const pendingSinceLabel = item.pendingSince ? new Date(item.pendingSince+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}) : '';
    return `<div class="dep-card">
      <div style="flex:1">
        <div class="dep-project">${projLink}</div>
        ${milestoneText ? `<div class="dep-reason" style="margin-top:3px;color:#cda869;font-style:italic">${escHtml(milestoneText)}</div>` : ''}
        <div class="dep-meta" style="margin-top:4px">
          Pending from: <strong style="color:#E6EDF3">${escHtml(pendingFrom)}</strong>
          ${pendingSinceLabel ? ` &nbsp;·&nbsp; Since: ${pendingSinceLabel}` : ''}
          ${daysLabel ? ` &nbsp;·&nbsp; <span style="color:#f0883e;font-weight:500">${daysLabel} waiting</span>` : ''}
        </div>
        <div class="dep-meta">${escHtml(item.responsible)} · ${escHtml(item.team||'—')}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end;white-space:nowrap">
        <span class="dep-type-badge dep-stakeholder">Pending Info</span>
        <span class="dep-status-badge dep-pending-info">${escHtml(pendingFrom)}</span>
      </div>
    </div>`;
  }).join('');

  // ── On Hold cards ──
  const holdCards = onHold.map(item=>{
    const projLink=`<a href="${escHtml(item.url)}" target="_blank" rel="noopener" style="color:#E6EDF3">${escHtml(item.name)}</a>`;
    return `<div class="dep-card">
      <div>
        <div class="dep-project">${projLink}</div>
        <div class="dep-reason">Project is on hold — awaiting decision or unblocking condition</div>
        <div class="dep-meta">${escHtml(item.responsible)} · ${escHtml(item.team)} · ${getQuarter(item.initialDue)}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end;white-space:nowrap">
        <span class="dep-type-badge dep-stakeholder">on hold</span>
        <span class="dep-status-badge dep-onhold">On Hold</span>
      </div>
    </div>`;
  }).join('');

  const depSection   = deps.length>0       ? `<div class="dep-group-header">🔗 Dependencies (${deps.length})</div>${depCards}` : '';
  const pendSection  = pendingInfo.length>0 ? `<div class="dep-group-header">⏳ Pending Stakeholder Input (${pendingInfo.length})</div>${pendingCards}` : '';
  const holdSection  = onHold.length>0      ? `<div class="dep-group-header">⏸ On Hold (${onHold.length})</div>${holdCards}` : '';

  return `<div class="dep-section">
    <div class="dep-section-header"><h3>Dependencies &amp; Blockers (${total})</h3></div>
    ${depSection}${pendSection}${holdSection}

}

// ─── Week KPIs helper (module-level) ─────────────────────────────────────────
function getWeekKpis(key){
  const mon = key.slice(0,7);
  const snap = RAW_DATA.weeklySnapshots[key];
  // Always use actual delivered count for this week (not cumulative from snapshot)
  const weeklyAutos = getDeliveredForWeek(key).length;
  if(snap) return {hours:snap.kpis.hoursSavedTotal, quality:snap.kpis.qualityScore, credits:snap.kpis.creditsUsed, autos:weeklyAutos, isApprox:false};
  const wn = parseInt(key.slice(-1));
  const d = getApproxWeekData(mon, wn);
  return {hours:d.hours, quality:d.quality, credits:d.credits, autos:weeklyAutos||d.automations, isApprox:true};
}

// ─── At-risk / blocked count ─────────────────────────────────────────────────
function getAtRiskCount(){
  const {deps, pendingInfo, onHold} = getDepsForPeriod();
  const seenGids = new Set();
  [...deps.map(d=>d.gid), ...pendingInfo.map(d=>d.gid), ...onHold.map(d=>d.gid)]
    .forEach(g=>{ if(g) seenGids.add(g); });
  // Also count Off Track dev items not already in onHold
  const onHoldGids = new Set(onHold.map(d=>d.gid));
  ASANA_DEV_ITEMS.filter(item=>
    item.initialDueRespected==='No' &&
    devPocMatch(item.responsible) &&
    depPeriodMatch(item.initialDue) &&
    !onHoldGids.has(item.gid)
  ).forEach(item=>seenGids.add(item.gid));
  return seenGids.size;
}

// ─── Weekly KPI delta table ───────────────────────────────────────────────────
function renderWeekKpiDeltaTable(weekKey){
  const mon = weekKey.slice(0,7);
  const wNum = parseInt(weekKey.slice(-1))||1;
  const curr = getWeekKpis(weekKey);
  const prevKey = wNum > 1 ? mon+'-W'+(wNum-1) : null;
  const prev = prevKey ? getWeekKpis(prevKey) : null;

  const inDev = ASANA_DEV_ITEMS.filter(item=>
    devPocMatch(item.responsible) && depPeriodMatch(item.initialDue)
  ).length;

  const prevInDev = prevKey ? (()=>{
    // Prev week: shift period back by approximation — use same count (data is monthly-level)
    return ASANA_DEV_ITEMS.filter(item=>devPocMatch(item.responsible) && depPeriodMatch(item.initialDue)).length;
  })() : null;

  const atRisk = getAtRiskCount();

  function delta(curr, prev, unit=''){
    if(prev===null||prev===undefined||curr===null||curr===undefined) return `<span class="delta-flat">— <small>no prior data</small></span>`;
    const diff = curr - prev;
    if(diff > 0) return `<span class="delta-up">▲ +${diff}${unit}</span>`;
    if(diff < 0) return `<span class="delta-dn">▼ ${diff}${unit}</span>`;
    return `<span class="delta-flat">→ 0</span>`;
  }

  const approxMark = curr.isApprox ? '<span class="wk-unit">~</span>' : '';
  const prevApproxMark = prev&&prev.isApprox ? '<span class="wk-unit">~</span>' : '';

  return `<div class="wk-kpi-table">
    <table>
      <thead>
        <tr>
          <th></th>
          <th>This Week</th>
          <th>vs Last Week</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Automations Delivered</td>
          <td>${curr.autos!=null?curr.autos:'—'}${approxMark}</td>
          <td>${delta(curr.autos, prev?prev.autos:null)}</td>
        </tr>
        <tr>
          <td>In Development</td>
          <td>${inDev}</td>
          <td>${delta(inDev, prevInDev)}</td>
        </tr>
        <tr>
          <td>On Hold</td>
          <td>${atRisk}</td>
          <td><span class="delta-flat">→ 0</span></td>
        </tr>
        <tr>
          <td>Hours Saved</td>
          <td>${curr.hours!=null?curr.hours:'—'}${curr.hours!=null?'<span class="wk-unit">hrs</span>':''}${approxMark}</td>
          <td>${delta(curr.hours, prev?prev.hours:null, '')}</td>
        </tr>
      </tbody>
    </table>
  </div>`;
}

      <div class="week-compare-grid">
        ${cell('Hours Saved',prev.hours,prev.isApprox)}

// OR dueEnd is empty/absent (item not yet scheduled — always shown for its responsible).
const IN_DEV_STATUSES = new Set([
  'Development of Initial Requirement',
  'Additional Requirement in Progress',
  'Logic Ready in Make',
  'QA Level'
  // 'Pending Information from Stakeholders' → tracked in Dependencies & Blockers only

function getInDevForWeek(weekKey){
  const mon = weekKey.slice(0,7); // e.g. "2026-06"
  return ASANA_INDEV_ITEMS.filter(item=>
    devPocMatch(item.responsible) &&
    IN_DEV_STATUSES.has(item.buildReadiness) &&
    (!item.dueEnd || item.dueEnd.startsWith(mon))
  );
}

function indevStatusInfo(idr, projectStatus){
  if(projectStatus==='green') return {label:'On Track',  cls:'badge-ontrack'};
  if(projectStatus==='yellow') return {label:'At Risk',   cls:'badge-atrisk'};
  if(projectStatus==='red')   return {label:'Off Track', cls:'badge-offtrack'};
  if(projectStatus==='blue')  return {label:'On Hold',   cls:'badge-hold'};
  if(idr==='Yes')                  return {label:'On Track',  cls:'badge-ontrack'};
  if(idr==='No')                   return {label:'Off Track', cls:'badge-offtrack'};
  if(idr==='See Milestone Notes')  return {label:'At Risk',   cls:'badge-atrisk'};
  return null;
}

// ─── Delivered items for a specific week ─────────────────────────────────────
function getDeliveredForWeek(weekKey){
  const mon = weekKey.slice(0,7);
  const wNum = parseInt(weekKey.slice(-1))||1;
  const wks = weeksForMonth(mon);
  const wkInfo = wks.find(w=>w.key==='W'+wNum) || wks[wNum-1];
  if(!wkInfo) return [];
  const yr = parseInt(mon.split('-')[0]);
  const mo = parseInt(mon.split('-')[1]);
  const start = new Date(yr, mo-1, wkInfo.startDay, 0, 0, 0);
  const end   = new Date(yr, mo-1, wkInfo.endDay, 23, 59, 59);
  return ASANA_DELIVERED_ITEMS.filter(item=>{
    if(!devPocMatch(item.responsible)) return false;
    const d = new Date(item.completedAt);
    return d >= start && d <= end;
  });
}

function getDeliveredForMonth(yrMon){
  return ASANA_DELIVERED_ITEMS.filter(item=>{
    if(!devPocMatch(item.responsible)) return false;
    return item.completedAt.startsWith(yrMon);
  });
}

// ─── 3-card week KPI strip ───────────────────────────────────────────────────
function renderWeekKpiCards(weekKey){
  const mon = weekKey.slice(0,7);
  const wNum = parseInt(weekKey.slice(-1))||1;
  const prevKey = wNum > 1 ? mon+'-W'+(wNum-1) : null;

  // Delivered: from Asana Portfolio completed_at dates (exact week range)
  const deliveredThisWeek = getDeliveredForWeek(weekKey).length;
  const deliveredPrevWeek = prevKey ? getDeliveredForWeek(prevKey).length : null;
  // Cumulative delivered in the whole month (POC-filtered)
  const cumulative = getDeliveredForMonth(mon).length;

  const inDevItems = getInDevForWeek(weekKey);
  const inDev = inDevItems.length;
  const onHoldItems = getOnHoldForWeek(weekKey);
  const onHold = onHoldItems.length;
  const onHoldPrev = prevKey ? getOnHoldForWeek(prevKey).length : null;
  const monShort = new Date(mon+'-01').toLocaleString('en-US',{month:'short'});

  function pill(curr, prev, invertColor=false){
    if(prev===null||prev===undefined||curr===null||curr===undefined) return '';
    const diff = curr - prev;
    let cls, lbl;
    if(diff > 0){
      cls = invertColor ? 'wk3-pill-dn' : 'wk3-pill-up';
      lbl = `+${diff} vs W${wNum-1}`;
    } else if(diff < 0){
      cls = invertColor ? 'wk3-pill-up' : 'wk3-pill-dn';
      lbl = `${diff} vs W${wNum-1}`;
    } else {
      cls = 'wk3-pill-flat';
      lbl = `= W${wNum-1}`;
    }
    return `<span class="wk3-pill ${cls}">${lbl}</span>`;
  }

  const flatPill = prevKey ? `<span class="wk3-pill wk3-pill-flat">= W${wNum-1}</span>` : '';

  return `<div class="week-kpi-3">
    <div class="wk3-card">
      <div class="wk3-label">Delivered</div>
      <div class="wk3-main">
        <span class="wk3-value">${deliveredThisWeek}</span>
        ${pill(deliveredThisWeek, deliveredPrevWeek)}
      </div>
      <div class="wk3-sub">${(RAW_DATA.weeklySnapshots[weekKey]||{}).kpis?(RAW_DATA.weeklySnapshots[weekKey].kpis.automationsDelivered)+' cumulative total':cumulative+' cumulative in '+monShort}</div>
    </div>
    <div class="wk3-card">
      <div class="wk3-label">In Development</div>
      <div class="wk3-main">
        <span class="wk3-value">${inDev}</span>
        ${flatPill}
      </div>
      <div class="wk3-sub">initialDue this month</div>
    </div>
    <div class="wk3-card">
      <div class="wk3-label">On Hold</div>
      <div class="wk3-main">
        <span class="wk3-value">${onHold}</span>
        ${pill(onHold, onHoldPrev, true)}
      </div>
      <div class="wk3-sub">currently paused</div>
    </div>
  </div>`;
}

      </div>`;
    return `
      <div class="week-header-card">
        <div>
          <div class="week-title">2025 — Weekly View</div>
          <div style="font-size:13px;color:#8B949E;margin-top:6px">N/A — No information for the requested period</div>
        </div>
        <span class="week-badge week-badge-snapshot">2025</span>
      </div>
      <div class="week-kpi-3" style="margin-bottom:20px">
        ${['Delivered','In Development','On Hold'].map(label=>`
          <div class="wk3-card">
            <div class="wk3-label">${label}</div>
            <div class="wk3-main"><span class="wk3-value" style="font-size:20px;color:#484F58">N/A</span></div>
            <div class="wk3-sub">no information available</div>
          </div>`).join('')}
      </div>
      ${naSection('✅ Delivered This Week')}
      ${naSection('🔧 In Development')}
      ${naSection('⏸ On Hold')}
      ${naSection('Dependencies &amp; Blockers')}
      ${renderDisclaimers()}`;
  }

  const mon = weekKey.slice(0,7);
  const wNum = parseInt(weekKey.slice(-1))||1;
  const snap = RAW_DATA.weeklySnapshots[weekKey];

  if(snap){
    const badgeCls=snap.isSnapshot?'week-badge-snapshot':'week-badge-current';
    const badgeLabel=snap.isSnapshot?'Historical Snapshot':'Current Week';
    const k=snap.kpis;
    const creditsDisplay=k.creditsUsed!=null?fmtNum(k.creditsUsed):'N/A';
    const html=`<div class="week-header-card">
      <div><div class="week-title">Week: ${escHtml(snap.dateRange)}</div><div style="font-size:13px;color:#8B949E;margin-top:6px">${weekExecOneLiner(weekKey)}</div></div>
      <span class="week-badge ${badgeCls}">${badgeLabel}</span>
    </div>
    ${renderWeekKpiCards(weekKey)}
    ${renderDeliveredTable(weekKey)}
    ${renderInDevWeekTable(weekKey)}
    ${renderOnHoldWeekTable(weekKey)}
    ${renderDependencies(weekKey)}
    ${renderDisclaimers()}`;
    return html;
  }

  // Approximate week
  const d=getApproxWeekData(mon, wNum);
  const wksApprox = weeksForMonth(mon);
  const wkInfo = wksApprox.find(w => w.key === 'W'+wNum) || wksApprox[wNum-1];
  const monLabel=new Date(mon+'-01').toLocaleString('en-US',{month:'long',year:'numeric'});
  const rangeLabel = wkInfo ? `${wkInfo.startDay}–${wkInfo.endDay}` : `${(wNum-1)*7+1}–${wNum*7}`;
  return `<div class="week-header-card">
    <div><div class="week-title">Week ${wNum}: ${monLabel} ${rangeLabel} (Mon–Fri)</div><div style="font-size:13px;color:#8B949E;margin-top:6px">${weekExecOneLiner(weekKey)}</div></div>
    <span class="week-badge week-badge-approx">Estimated</span>
  </div>
  ${renderWeekKpiCards(weekKey)}
  ${renderDeliveredTable(weekKey)}
  ${renderInDevWeekTable(weekKey)}
  ${renderOnHoldWeekTable(weekKey)}
  ${renderDependencies(weekKey)}
  ${renderDisclaimers()}`;
}

// ─── Main render ──────────────────────────────────────────────────────────────
function render(){
  const main=document.getElementById('mainContent');
  if(S.week!=='all'){
    main.innerHTML=renderWeekView(S.week);
    return;
  }
  const kpis=computeKPIs();
  let html=`<div class="kpi-strip">
    <div class="kpi-card"><div class="kpi-label">Automations Delivered</div><div class="kpi-value">${kpis.delivered}</div><div class="kpi-sub">${S.week&&S.week!=='all'?'delivered this week':S.months.length>0||S.year!=='all'?'effective in selected period':'total projects in spreadsheet'}</div></div>
    <div class="kpi-card"><div class="kpi-label">Estimated Time Saved</div><div class="kpi-value">${kpis.hours}</div><div class="kpi-sub">man-hrs/month saved (effective from month)</div></div>
    <div class="kpi-card"><div class="kpi-label">Avg Quality Score</div><div class="kpi-value" style="font-size:${kpis.quality==='N/A'?'22':'24'}px">${kpis.quality}</div><div class="kpi-sub">target ≥ 99%</div></div>
    <div class="kpi-card"><div class="kpi-label">Credits Used <span style="font-size:10px;color:#484F58;text-transform:none;letter-spacing:0;font-weight:400">* tracking from Jan'26 onwards</span></div><div class="kpi-value" style="font-size:${kpis.credits==='N/A'?'22':'20'}px">${kpis.credits}</div><div class="kpi-sub">Make operations</div></div>
  </div>`;
  html+=execSummary(kpis);
  html+=`<div class="charts-row">
    <div class="chart-card"><h3>Monthly Credits Used — Jan–Jul 2026</h3><div class="chart-wrap"><canvas id="creditsCanvas"></canvas></div></div>
    <div class="chart-card"><h3>Quality Score % — Jan–Jul 2026</h3><div class="chart-wrap" id="qualityChartWrap"><canvas id="qualityCanvas"></canvas></div></div>
    <div class="chart-card"><h3>Automation Requests per Department</h3><div class="chart-wrap" style="overflow-y:auto;overflow-x:hidden"><div id="teamsInner" style="position:relative;height:220px"><canvas id="teamsCanvas"></canvas></div></div></div>
  </div>`;
  html+=renderAutomationsTable();
  html+=renderDependencies();
  html+=renderRoadmap();
  html+=renderDisclaimers();
  main.innerHTML=html;
  renderCharts();
}

// ─── Init ─────────────────────────────────────────────────────────────────────
rebuildMonthPanel();
rebuildWeekDropdown();
render();
</script>
</body>
</html>
